name: Windows build and tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up .NET 8
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: '8.0.x'
      - name: Behavioral tests
        run: dotnet run --project tests/RoutineRest.Tests/RoutineRest.Tests.csproj -c Release
      - name: Build Windows application
        run: dotnet publish src/RoutineRest.App/RoutineRest.App.csproj -c Release --self-contained false -o app
